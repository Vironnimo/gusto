<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titel }} · Küchenbuch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&family=Hanken+Grotesk:wght@400;450;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">
      <span class="brand-mark">❖</span>
      <span class="brand-text">Küchenbuch</span>
    </a>
    <nav class="nav">
      <a href="/" class="{{ 'is-active' if nav == 'rezepte' else '' }}">Rezepte</a>
      <a href="/vorschlaege" class="{{ 'is-active' if nav == 'vorschlaege' else '' }}">Vorschläge</a>
      <a href="/logbuch" class="{{ 'is-active' if nav == 'logbuch' else '' }}">Logbuch</a>
      <a href="/neu" class="nav-cta">＋ Neu</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Küchenbuch — deine Rezepte, lokal &amp; in Markdown.
  </footer>
  <script src="/static/app.js" defer></script>
</body>
</html>
