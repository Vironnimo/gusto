[project]
name = "gusto"
version = "0.1.7"
description = "Markdown-basiertes Rezept-System, steuerbar per CLI und Web – agent-freundlich."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Managed apps install the server extra; the standalone CLI client stays stdlib-only.
web = ["fastapi", "uvicorn[standard]", "jinja2", "markdown", "python-multipart", "pillow"]
test = ["httpx2", "playwright", "pyyaml"]

[project.scripts]
gusto = "gusto.cli:main"

[project.gui-scripts]
gusto-autostart = "gusto.cli:autostart_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gusto"]

[tool.setuptools.package-data]
gusto = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.webmanifest",
    "static/icons/*.png",
]

[tool.setuptools.data-files]
"share/gusto/skill/gusto" = ["skill/gusto/SKILL.md"]
"share/gusto/skill/gusto/references" = [
    "skill/gusto/references/cli.md",
    "skill/gusto/references/installation.md",
    "skill/gusto/references/telegram.md",
]
