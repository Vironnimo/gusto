[project]
name = "gusto"
version = "0.1.2"
description = "Markdown-basiertes Rezept-System, steuerbar per CLI und Web – agent-freundlich."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Werden erst fuer die Web-UI gebraucht:
web = ["fastapi", "uvicorn[standard]", "jinja2", "markdown", "python-multipart", "pillow"]

[project.scripts]
gusto = "gusto.cli:main"

[project.gui-scripts]
gusto-autostart = "gusto.cli:autostart_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gusto"]

[tool.setuptools.package-data]
gusto = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.webmanifest",
    "static/icons/*.png",
]
