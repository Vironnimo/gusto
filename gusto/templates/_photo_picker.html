{% macro photo_picker(prefix) %}
<div class="photo-picker" data-photo-picker>
  <div class="photo-choices">
    <label class="photo-choice photo-choice-camera" for="{{ prefix }}-camera">
      <span class="photo-choice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img"><path d="M8.5 5.5 10 3.8h4l1.5 1.7H19a2 2 0 0 1 2 2v10.2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2h3.5Z"/><circle cx="12" cy="12.5" r="4"/></svg>
      </span>
      <span><strong>Foto aufnehmen</strong><small>Rückseitige Kamera</small></span>
      <input class="photo-input" id="{{ prefix }}-camera" type="file"
             name="image_camera" accept="image/*" capture="environment"
             data-photo-input data-photo-source="Aufnahme">
    </label>
    <label class="photo-choice" for="{{ prefix }}-file">
      <span class="photo-choice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 17 4.5-4.5 3.2 3.2 2-2L19 18"/></svg>
      </span>
      <span><strong>Bild auswählen</strong><small>Aus Fotos oder Dateien</small></span>
      <input class="photo-input" id="{{ prefix }}-file" type="file"
             name="image_file" accept="image/jpeg,image/png,image/webp,image/gif"
             data-photo-input data-photo-source="Auswahl">
    </label>
  </div>
  <div class="photo-preview" data-photo-preview hidden>
    <img src="" alt="Vorschau des ausgewählten Fotos" data-photo-preview-image>
    <span><strong data-photo-preview-name></strong><small data-photo-preview-source></small></span>
    <button type="button" class="btn-text" data-photo-clear>Verwerfen</button>
  </div>
  <noscript><p class="photo-nojs">Das Foto wird beim Speichern übernommen.</p></noscript>
</div>
{% endmacro %}
