{% extends "base.html" %}
{% block content %}
<section class="form-wrap">
  <a class="back" href="{{ '/' if not r else '/recipe/' ~ r.slug }}">← Zurück</a>
  <h1 class="page-title">{{ 'Rezept bearbeiten' if r else 'Neues Rezept' }}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="recipe-form" method="post" action="{{ form_action }}">
    <label>Titel
      <input type="text" name="title" value="{{ form.title }}" required autofocus>
    </label>
    <div class="form-row">
      <label>Tags <span class="hint">kommagetrennt</span>
        <input type="text" name="tags" value="{{ form.tags }}" placeholder="pasta, schnell, vegetarisch">
      </label>
      <label>Dauer <span class="hint">Minuten</span>
        <input type="number" name="duration" value="{{ form.duration }}" min="0" inputmode="numeric">
      </label>
      <label>Portionen
        <input type="number" name="servings" value="{{ form.servings }}" min="0" inputmode="numeric">
      </label>
    </div>
    <label>Rezept <span class="hint">Markdown — Zutaten &amp; Zubereitung</span>
      <textarea name="content" rows="18" spellcheck="false">{{ form.content }}</textarea>
    </label>
    <div class="form-actions">
      <button class="btn" type="submit">Speichern</button>
      <a class="btn-ghost" href="{{ '/' if not r else '/recipe/' ~ r.slug }}">Abbrechen</a>
    </div>
  </form>
</section>
{% endblock %}
